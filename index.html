<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivo de Lore - Guía de Referencias</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .fandom-title { font-family: 'Cinzel', serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .transition-page { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .hidden-section { display: none; opacity: 0; transform: translateY(10px); }
        
        /* Efectos de brillo por categorías */
        .glow-gold { box-shadow: 0 0 20px rgba(234, 179, 8, 0.1); border-left: 4px solid #eab308; }
        .glow-blue { box-shadow: 0 0 20px rgba(59, 130, 246, 0.1); border-left: 4px solid #3b82f6; }
        .glow-green { box-shadow: 0 0 20px rgba(34, 197, 94, 0.1); border-left: 4px solid #22c55e; }
        .glow-purple { box-shadow: 0 0 20px rgba(168, 85, 247, 0.1); border-left: 4px solid #a855f7; }
        
        .card-hover:hover { transform: scale(1.02); background: rgba(51, 65, 85, 0.8); }
        
        blockquote { border-left: 4px solid #64748b; padding-left: 1rem; font-style: italic; color: #94a3b8; }
    </style>
</head>
<body class="min-h-screen bg-slate-950 selection:bg-yellow-500/30">

    <div id="app" class="max-w-md mx-auto p-4 md:p-6 pb-20">
        
        <header class="text-center py-12">
            <h1 class="fandom-title text-3xl font-bold tracking-[0.2em] text-yellow-500 drop-shadow-md">ARCHIVO DE LORE</h1>
            <p class="text-slate-500 text-[10px] uppercase tracking-[0.3em] mt-3">Guía para que no se te escape ni una referencia</p>
            <div class="h-0.5 w-16 bg-gradient-to-r from-transparent via-yellow-600 to-transparent mx-auto mt-6 opacity-50"></div>
        </header>

        <!-- VISTA MENÚ -->
        <section id="view-menu" class="transition-page space-y-6">
            <div class="flex items-center justify-between border-b border-slate-800 pb-4">
                <h2 class="text-sm font-bold text-slate-400 uppercase tracking-widest">Registros Detectados</h2>
                <span class="bg-slate-800 text-yellow-500 text-[10px] px-2 py-1 rounded-md font-bold" id="item-count">0</span>
            </div>
            
            <div id="menu-grid" class="grid grid-cols-1 gap-4">
                <!-- Inyectado por JS -->
            </div>
        </section>

        <!-- VISTA DETALLE -->
        <section id="view-detail" class="hidden-section transition-page">
            <button onclick="navigateTo('')" class="mb-8 flex items-center text-slate-400 hover:text-yellow-500 transition-all group bg-slate-900/50 pr-4 rounded-full border border-slate-800">
                <div class="bg-slate-800 p-3 rounded-full mr-3 group-hover:bg-yellow-500 group-hover:text-slate-950 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
                    </svg>
                </div>
                <span class="text-[10px] uppercase font-bold tracking-widest">Volver al Archivo</span>
            </button>

            <div id="detail-content">
                <!-- Inyectado por JS -->
            </div>
        </section>

    </div>

    <script>
        const items = {
            "the-shire": {
                title: "The Shire",
                tags: ["Libro", "Película"],
                origin: "El Señor de los Anillos / El Hobbit (J.R.R. Tolkien)",
                detail: "Tierra fértil de colinas verdes y paz absoluta. El hogar de los Hobbits es famoso por su agricultura, su cerveza y sus banquetes. Es un lugar que representa la inocencia frente a la oscuridad del mundo.",
                quote: "En un agujero en el suelo, vivía un hobbit. No un agujero húmedo, sucio y repugnante... era un agujero-hobbit, y eso significa comodidad.",
                icon: "🌿",
                color: "green",
                image: "https://placehold.co/600x400/064e3b/f1f5f9?text=La+Comarca"
            },
            "roshar": {
                title: "Roshar",
                tags: ["Libro"],
                origin: "El Archivo de las Tormentas (Brandon Sanderson)",
                detail: "Un mundo de roca azotado por las Altas Tormentas. Aquí, la flora se retrae al tacto y la fauna se protege con caparazones. La Luz de Tormenta es la energía que alimenta el mundo y los poderes de los Caballeros Radiantes.",
                quote: "Vida antes que muerte. Fuerza antes que debilidad. Viaje antes que destino.",
                icon: "🌪️",
                color: "blue",
                image: "https://placehold.co/600x400/1e3a8a/f1f5f9?text=Roshar"
            },
            "hyrule": {
                title: "Hyrule",
                tags: ["Videojuego"],
                origin: "The Legend of Zelda (Nintendo)",
                detail: "Reino legendario bendecido por la Trifuerza. Ha sobrevivido a eras de oscuridad gracias al ciclo eterno del héroe de túnica verde y la princesa de la sabiduría.",
                quote: "Es peligroso ir solo. Toma esto.",
                icon: "🗡️",
                color: "green",
                image: "https://placehold.co/600x400/14532d/f1f5f9?text=Hyrule"
            },
            "hogwarts": {
                title: "Hogwarts",
                tags: ["Libro", "Película"],
                origin: "Harry Potter (J.K. Rowling)",
                detail: "Colegio de Magia y Hechicería fundado por los cuatro magos más poderosos de su época. Un castillo vivo donde las escaleras se mueven y los techos reflejan el cielo.",
                quote: "Las palabras son, en mi no tan humilde opinión, nuestra fuente más inagotable de magia.",
                icon: "🏰",
                color: "purple",
                image: "https://placehold.co/600x400/4c1d95/f1f5f9?text=Hogwarts"
            },
            "felix-felicis": {
                title: "Felix Felicis",
                tags: ["Libro", "Película"],
                origin: "Harry Potter y el Misterio del Príncipe",
                detail: "Poción llamada 'Suerte Líquida'. Otorga al bebedor una racha de éxito total. Es de color oro fundido y extremadamente difícil de preparar.",
                quote: "Es oro líquido... desastrosa si se prepara mal, pero si se hace bien, te sentirás capaz de cualquier cosa.",
                icon: "✨",
                color: "gold",
                image: "https://placehold.co/600x400/854d0e/f1f5f9?text=Felix+Felicis"
            },
            "minuta-hogwarts": {
                title: "Carta de Hogwarts",
                tags: ["Libro", "Película"],
                origin: "Harry Potter y la Piedra Filosofal",
                detail: "La invitación oficial entregada por lechuza que cambia la vida de cualquier joven mago. Escrita en tinta verde sobre pergamino de vitela.",
                quote: "Tenemos el placer de informarle de que dispone de una plaza en el Colegio Hogwarts de Magia y Hechicería.",
                icon: "✉️",
                color: "gold",
                image: "https://placehold.co/600x400/78350f/f1f5f9?text=La+Carta"
            },
            "tanabata": {
                title: "Festival Tanabata",
                tags: ["Anime", "Cultura"],
                origin: "Tradición Japonesa / Múltiples Animes",
                detail: "El festival de las estrellas que celebra el encuentro de Orihime y Hikoboshi. Se escriben deseos en tiras de papel (tanzaku) y se cuelgan en bambú.",
                quote: "Incluso si estamos separados por el río de estrellas, nuestros deseos nos mantendrán unidos.",
                icon: "🏮",
                color: "blue",
                image: "https://placehold.co/600x400/1e40af/f1f5f9?text=Tanabata"
            },
            "trifuerza": {
                title: "La Trifuerza",
                tags: ["Videojuego"],
                origin: "The Legend of Zelda",
                detail: "Reliquia definitiva dejada por las diosas Din, Nayru y Farore. Representa el equilibrio entre Poder, Sabiduría y Valor.",
                quote: "Aquel que toque la Trifuerza verá sus deseos más profundos reflejados en el mundo.",
                icon: "📐",
                color: "gold",
                image: "https://placehold.co/600x400/713f12/f1f5f9?text=Trifuerza"
            },
            "pokeball": {
                title: "Poké Ball",
                tags: ["Videojuego", "Anime"],
                origin: "Pokémon (Game Freak)",
                detail: "Tecnología de miniaturización diseñada para capturar, transportar y entrenar criaturas salvajes. Un icono global de la cultura geek.",
                quote: "¡Hazte con todos!",
                icon: "🔴",
                color: "red",
                image: "https://placehold.co/600x400/991b1b/f1f5f9?text=Pokebola"
            },
            "radiantes": {
                title: "Signo Radiante",
                tags: ["Libro"],
                origin: "El Archivo de las Tormentas (Cosmere)",
                detail: "Símbolo de las antiguas órdenes de caballeros que protegían a la humanidad. Representa el vínculo Nahel entre un humano y un spren.",
                quote: "Los Ideales no son leyes, son una brújula. Nos dicen hacia dónde caminar, no dónde detenernos.",
                icon: "💠",
                color: "blue",
                image: "https://placehold.co/600x400/1d4ed8/f1f5f9?text=Juramento"
            }
        };

        function navigateTo(id) {
            try {
                if (id) {
                    window.history.pushState(null, null, '#' + id);
                } else {
                    window.history.pushState(null, null, window.location.pathname);
                }
            } catch (e) {
                console.warn("Navegación simulada.");
            }
            router(id);
        }

        function renderMenu() {
            const grid = document.getElementById('menu-grid');
            grid.innerHTML = '';
            const keys = Object.keys(items);
            document.getElementById('item-count').innerText = keys.length;

            keys.forEach(id => {
                const item = items[id];
                const card = document.createElement('div');
                card.className = `glass p-4 rounded-2xl flex items-center justify-between cursor-pointer card-hover glow-${item.color} transition-all`;
                card.onclick = () => navigateTo(id);
                card.innerHTML = `
                    <div class="flex items-center space-x-4">
                        <span class="text-3xl">${item.icon}</span>
                        <div>
                            <div class="flex flex-wrap gap-1 mb-1">
                                ${item.tags.map(t => `<span class="text-[8px] bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded uppercase font-bold tracking-tighter">${t}</span>`).join('')}
                            </div>
                            <h3 class="font-bold text-white text-md">${item.title}</h3>
                            <p class="text-[9px] text-yellow-600 uppercase font-medium truncate w-40">${item.origin}</p>
                        </div>
                    </div>
                    <div class="text-slate-600">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderDetail(id) {
            const item = items[id];
            const container = document.getElementById('detail-content');
            if (!item) { navigateTo(''); return; }

            container.innerHTML = `
                <div class="space-y-6 animate-in fade-in duration-500">
                    <div class="text-center py-4">
                        <span class="text-7xl mb-4 block drop-shadow-2xl">${item.icon}</span>
                        <div class="flex justify-center gap-2 mb-3">
                            ${item.tags.map(t => `<span class="bg-yellow-500/10 text-yellow-500 text-[9px] px-3 py-1 rounded-full border border-yellow-500/20 font-bold uppercase tracking-widest">${t}</span>`).join('')}
                        </div>
                        <h2 class="fandom-title text-4xl font-bold text-white tracking-tight">${item.title}</h2>
                    </div>

                    <div class="glass p-6 rounded-3xl space-y-4">
                        <div>
                            <h4 class="text-yellow-600 text-[10px] font-bold uppercase tracking-widest mb-1">Origen</h4>
                            <p class="text-slate-200 font-medium">${item.origin}</p>
                        </div>
                        <div class="h-px bg-slate-800 w-full"></div>
                        <div>
                            <h4 class="text-yellow-600 text-[10px] font-bold uppercase tracking-widest mb-1">Detalle</h4>
                            <p class="text-slate-300 text-sm leading-relaxed">${item.detail}</p>
                        </div>
                    </div>

                    <div class="glass p-6 rounded-3xl relative overflow-hidden italic border-l-4 border-yellow-500">
                        <svg class="absolute -top-2 -left-2 h-12 w-12 text-white opacity-5" fill="currentColor" viewBox="0 0 32 32"><path d="M10 8v8H6v2a2 2 0 002 2h2v4H8a6 6 0 01-6-6v-8a2 2 0 012-2h4zm12 0v8h-4v2a2 2 0 002 2h2v4h-2a6 6 0 01-6-6v-8a2 2 0 012-2h4z"/></svg>
                        <p class="text-slate-400 text-sm leading-relaxed relative z-10">${item.quote}</p>
                    </div>

                    <div class="rounded-3xl overflow-hidden glass p-2">
                        <img src="${item.image}" class="w-full h-auto rounded-2xl grayscale-[0.3] hover:grayscale-0 transition-all duration-500" 
                             onerror="this.src='https://placehold.co/600x400/1e293b/94a3b8?text=${item.title}'">
                    </div>
                </div>
            `;
        }

        function router(providedId) {
            const hash = providedId !== undefined ? providedId : location.hash.replace('#', '');
            const menuView = document.getElementById('view-menu');
            const detailView = document.getElementById('view-detail');

            if (hash && items[hash]) {
                renderDetail(hash);
                menuView.classList.add('hidden-section');
                setTimeout(() => {
                    menuView.style.display = 'none';
                    detailView.style.display = 'block';
                    window.scrollTo(0, 0);
                    setTimeout(() => detailView.classList.remove('hidden-section'), 50);
                }, 300);
            } else {
                detailView.classList.add('hidden-section');
                setTimeout(() => {
                    detailView.style.display = 'none';
                    menuView.style.display = 'block';
                    renderMenu();
                    setTimeout(() => menuView.classList.remove('hidden-section'), 50);
                }, 300);
            }
        }

        window.addEventListener('popstate', () => router());
        window.onload = () => router();
    </script>
</body>
</html>
