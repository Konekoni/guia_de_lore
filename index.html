        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f1f5f9; }

        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .transition-page { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .hidden-section { display: none; opacity: 0; transform: translateY(10px); }
        
        .tag-libro { background: #1e3a8a; color: #dbeafe; } 
        .tag-pelicula { background: #7f1d1d; color: #fee2e2; } 
        .tag-videojuego { background: #14532d; color: #dcfce7; } 
        .tag-anime { background: #581c87; color: #f3e8ff; } 
        .tag-cultura { background: #713f12; color: #fef9c3; } 
        .tag-simbolo { background: #7c2d12; color: #ffedd5; }
        .tag-serie { background: #0369a1; color: #e0f2fe; }
        .tag-juego { background: #15803d; color: #dcfce7; }
        
        .location-badge { background: #eab308; color: #422006; font-weight: 800; }
        .card-hover:hover { transform: translateY(-4px); border-color: rgba(234, 179, 8, 0.5); box-shadow: 0 10px 20px -10px rgba(234, 179, 8, 0.3); }
        blockquote { border-left: 3px solid #eab308; padding-left: 1rem; font-style: italic; color: #94a3b8; }
        .lightbox-img { transition: opacity 0.3s ease-in-out; }
    </style>
</head>

        function navigateTo(id) {
            try {
                window.location.hash = id;
            } catch (e) {
                console.warn("Navegación bloqueada.");
            }
            router(id); 
        }

        function getTagClass(tag) {
            const t = tag.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            return `tag-dots`; // Generación de tag dinámico compatible
            return `tag-${t}`;
        }

        function renderOrigins() {
            const grid = document.getElementById('origins-grid');
            grid.innerHTML = '';
            Object.keys(origins).forEach(id => {
                const origin = origins[id];
                const itemCount = Object.values(items).filter(item => item.originId === id).length;
                
                const card = document.createElement('div');
                card.className = `glass p-6 rounded-3xl cursor-pointer card-hover border border-slate-800 flex items-center gap-4`;
                card.onclick = () => navigateTo(`origin-${id}`);
                card.innerHTML = `
                    <div class="text-4xl">${origin.emoji}</div>
                    <div class="flex-1">
                        <h3 class="fandom-title text-lg font-bold text-yellow-500">${origin.name}</h3>
                        <div class="flex gap-1 mt-1">
                            ${origin.tags.map(t => `<span class="text-[7px] px-1.5 py-0.5 rounded uppercase font-bold ${getTagClass(t)}">${t}</span>`).join('')}
                        </div>
                    </div>
                    <div class="ml-auto flex flex-col items-center justify-center bg-slate-900/60 w-12 h-12 rounded-2xl border border-slate-800/80 shrink-0">
                        <span class="text-sm font-bold text-yellow-500/90 leading-none">${itemCount}</span>
                        <span class="text-[7px] uppercase tracking-widest text-slate-500 mt-1">${itemCount === 1 ? 'Ref' : 'Refs'}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderItemsInOrigin(originId) {
            const origin = origins[originId];
            const header = document.getElementById('origin-info-header');
            const grid = document.getElementById('items-grid');
            header.innerHTML = `<div class="text-center glass p-6 rounded-3xl border-b-2 border-yellow-500/50"><div class="text-5xl mb-3">${origin.emoji}</div><h2 class="fandom-title text-2xl font-bold text-yellow-500 mb-2">${origin.name}</h2></div>`;
            grid.innerHTML = '';
            
            const matchedItems = Object.keys(items).filter(k => items[k].originId === originId);
            if(matchedItems.length === 0) {
                grid.innerHTML = `<div class="text-center text-slate-500 text-xs py-8">No hay referencias registradas.</div>`;
                return;
            }

            matchedItems.forEach(itemId => {
                const item = items[itemId];
                const div = document.createElement('div');
                div.className = `glass p-4 rounded-2xl flex items-center justify-between cursor-pointer card-hover border border-slate-800`;
                div.onclick = () => navigateTo(itemId);
                div.innerHTML = `<div><h4 class="font-bold text-white uppercase text-sm">${item.title}</h4><p class="text-yellow-500/70 text-[9px] font-bold uppercase">📍 ${item.location}</p></div><span class="text-xl">${item.emoji}</span>`;
                grid.appendChild(div);
            });
        }

        function renderDetail(itemId) {
            const item = items[itemId];
            const origin = origins[item.originId];
            const container = document.getElementById('detail-content');
            document.getElementById('back-to-list').onclick = () => navigateTo(`origin-${item.originId}`);
            document.getElementById('back-text').innerText = `Explorar más referencias de ${origin.name}`;

            let photosHtml = '';
            const itemPhotos = item.photos || [];
            
            if (itemPhotos.length > 0) {

                                        <p class="text-[10px] font-semibold text-white truncate">${photo.title || 'Ver foto'}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="space-y-6">
                    <div class="text-center">
                        <div class="text-6xl mb-4">${item.emoji}</div>
                        <h2 class="fandom-title text-3xl font-bold text-yellow-500">${item.title}</h2>
                        <div class="location-badge inline-block px-4 py-1 rounded-full text-[10px] uppercase mt-4">En: ${item.location}</div>
                    </div>
                    
                    <div class="glass p-5 rounded-3xl border-l-4 border-slate-700">
                        <h4 class="text-slate-500 text-[10px] font-bold uppercase mb-1">Origen</h4>
                        <div class="font-bold text-white text-base">${origin.name}</div>
                        <p class="text-slate-400 text-xs italic mt-1">${origin.summary}</p>
                    </div>
                    
                    <div class="glass p-5 rounded-3xl border border-slate-800">
                        <h4 class="text-yellow-600 text-[10px] font-bold uppercase mb-2">Detalle</h4>
                        <p class="text-slate-200 text-sm">${item.detail}</p>
                    </div>
                    
                    <blockquote class="my-6">
                        <p class="text-slate-400 text-sm italic">"${item.quote}"</p>
                    </blockquote>
                    
                    <div class="glass p-5 rounded-3xl border border-slate-800 space-y-4">
                        <h4 class="text-slate-500 text-[10px] font-bold uppercase">Opinión</h4>
                        ${item.comments.map(c => `
                            <div class="border-l-2 border-slate-800 pl-3">
                                <span class="text-[9px] px-2 py-0.5 rounded font-bold uppercase bg-yellow-500/20 text-yellow-400">${c.by}</span>
                                <p class="text-slate-300 text-sm italic mt-1">"${c.text}"</p>
                            </div>
                        `).join('')}
                    </div>

                    ${photosHtml}
                </div>`;
        }

        function openLightbox(itemId, index) {
            const item = items[itemId];
            if (!item || !item.photos || item.photos.length === 0) return;

            currentPhotosArray = item.photos;
            currentPhotoIndex = index;

            const lb = document.getElementById('lightbox');
            lb.classList.remove('hidden');
            setTimeout(() => { lb.classList.remove('opacity-0'); }, 10);
            document.body.style.overflow = 'hidden';
            updateLightboxContent();
        }

        function closeLightbox() {
            const lb = document.getElementById('lightbox');
            lb.classList.add('opacity-0');
            document.body.style.overflow = '';
            setTimeout(() => { lb.classList.add('hidden'); }, 300);
        }

        function updateLightboxContent() {
            if (currentPhotosArray.length === 0) return;
            const photo = currentPhotosArray[currentPhotoIndex];

            const imgEl = document.getElementById('lightbox-current-img');
            const titleEl = document.getElementById('lightbox-title');
            const descEl = document.getElementById('lightbox-desc');
            const counterEl = document.getElementById('lightbox-counter');

            imgEl.style.opacity = '0.3';
            
            setTimeout(() => {
                imgEl.src = photo.url;
                imgEl.onerror = function() {
                    this.onerror = null;
                    this.src = 'https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?auto=format&fit=crop&q=80&w=800';
                };
                titleEl.innerText = photo.title || 'Sin título';
                descEl.innerText = photo.desc || 'Sin descripción.';
                counterEl.innerText = (currentPhotoIndex + 1) + " / " + currentPhotosArray.length;
                imgEl.style.opacity = '1';
            }, 150);
        }

        function nextLightboxImage(event) {
            if (event) event.stopPropagation();
            if (currentPhotosArray.length <= 1) return;
            currentPhotoIndex = (currentPhotoIndex + 1) % currentPhotosArray.length;
            updateLightboxContent();
        }

        function prevLightboxImage(event) {
            if (event) event.stopPropagation();
            if (currentPhotosArray.length <= 1) return;
            currentPhotoIndex = (currentPhotoIndex - 1 + currentPhotosArray.length) % currentPhotosArray.length;
            updateLightboxContent();
        }

        const touchArea = document.getElementById('lightbox-touch-area');
        touchArea.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        touchArea.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipeGesture();
        }, { passive: true });

        function handleSwipeGesture() {
            const threshold = 50;
            if (touchEndX < touchStartX - threshold) { nextLightboxImage(); }
            if (touchEndX > touchStartX + threshold) { prevLightboxImage(); }
        }

        document.addEventListener('keydown', (e) => {
            const lb = document.getElementById('lightbox');
            if (!lb.classList.contains('hidden')) {
                if (e.key === 'ArrowRight') { nextLightboxImage(); }
                else if (e.key === 'ArrowLeft') { prevLightboxImage(); }
                else if (e.key === 'Escape') { closeLightbox(); }
            }
        });

        function router(manualId) {
            const hash = manualId !== undefined ? manualId : location.hash.replace('#', '');
            const vOrigins = document.getElementById('view-origins');
            const vItems = document.getElementById('view-items');
            const vDetail = document.getElementById('view-detail');

            closeLightbox();

            [vOrigins, vItems, vDetail].forEach(v => {
                v.style.display = 'none';
                v.classList.add('hidden-section');
            });

            if (!hash) {
                renderOrigins();
                show(vOrigins);
            } else if (hash.startsWith('origin-')) {
                const oid = hash.replace('origin-', '');
                if (origins[oid]) {
                    renderItemsInOrigin(oid);
                    show(vItems);
                } else { navigateTo(''); }
            } else if (items[hash]) {
                renderDetail(hash);
                show(vDetail);
            } else {
                navigateTo('');
            }
        }

        function show(el) {
            el.style.display = 'block';
            setTimeout(() => {
                el.classList.remove('hidden-section');
                el.style.opacity = '1';
                el.style.transform = 'translateY(0)';
            }, 50);
            window.scrollTo(0, 0);
        }

        window.addEventListener('hashchange', () => router());
        window.onload = () => router();
    </script>
</body>
</html>
