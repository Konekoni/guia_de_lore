<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivo de Lore - Boda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f1f5f9; }
        .fandom-title { font-family: 'Cinzel', serif; }
        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .transition-page { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .hidden-section { display: none; opacity: 0; transform: translateY(10px); }
        
        .tag-libro { background: #1e3a8a; color: #dbeafe; } 
        .tag-pelicula { background: #7f1d1d; color: #fee2e2; } 
        .tag-videojuego { background: #14532d; color: #dcfce7; } 
        .tag-anime { background: #581c87; color: #f3e8ff; } 
        .tag-cultura { background: #713f12; color: #fef9c3; } 
        .tag-simbolo { background: #7c2d12; color: #ffedd5; }
        
        .location-badge { background: #eab308; color: #422006; font-weight: 800; }
        .card-hover:hover { transform: translateY(-4px); border-color: rgba(234, 179, 8, 0.5); box-shadow: 0 10px 20px -10px rgba(234, 179, 8, 0.3); }
        blockquote { border-left: 3px solid #eab308; padding-left: 1rem; font-style: italic; color: #94a3b8; }
    </style>
</head>
<body class="min-h-screen bg-slate-950 selection:bg-yellow-500/30 pb-10">

    <div id="app" class="max-w-md mx-auto p-4 md:p-6">
        <header class="text-center py-8">
            <h1 onclick="navigateTo('')" class="fandom-title text-3xl font-bold tracking-[0.15em] text-yellow-500 drop-shadow-md cursor-pointer">ARCHIVO DE LORE</h1>
            <p class="text-slate-500 text-[10px] uppercase tracking-[0.2em] mt-2">Guía para que no se te escape ni una referencia</p>
            <div class="h-px w-24 bg-gradient-to-r from-transparent via-slate-700 to-transparent mx-auto mt-6"></div>
        </header>

        <!-- VISTA 1: MENÚ DE ORÍGENES -->
        <section id="view-origins" class="transition-page space-y-4">
            <h2 class="text-slate-400 text-[11px] uppercase tracking-widest font-bold mb-4 text-center">Explora por Universos</h2>
            <div id="origins-grid" class="grid grid-cols-1 gap-4"></div>
        </section>

        <!-- VISTA 2: LISTA DE ITEMS POR ORIGEN -->
        <section id="view-items" class="hidden-section transition-page">
            <button onclick="navigateTo('')" class="mb-6 flex items-center text-slate-400 hover:text-yellow-500 transition-all bg-slate-900/80 pl-2 pr-4 py-2 rounded-full border border-slate-800">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
                <span class="text-[10px] uppercase font-bold tracking-widest">Volver a Orígenes</span>
            </button>
            <div id="origin-info-header" class="mb-8"></div>
            <div id="items-grid" class="space-y-3"></div>
        </section>

        <!-- VISTA 3: DETALLE DE ITEM -->
        <section id="view-detail" class="hidden-section transition-page">
            <button id="back-to-list" class="mb-6 flex items-center text-slate-400 hover:text-yellow-500 transition-all bg-slate-900/80 pl-2 pr-4 py-2 rounded-full border border-slate-800">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
                <span id="back-text" class="text-[10px] uppercase font-bold tracking-widest">Volver</span>
            </button>
            <div id="detail-content"></div>
        </section>
    </div>

    <script>
        const origins = {
          "lotr": {
                    "name": "El Señor de los Anillos",
                    "emoji": "🌋",
                    "summary": "La obra épica de Tolkien sobre la Tierra Media.",
                    "tags": [
                              "Libro",
                              "Película"
                    ]
          },
          "stormlight": {
                    "name": "El Archivo de las Tormentas",
                    "emoji": "⛈️",
                    "summary": "Fantasía épica de Brandon Sanderson en el mundo de Roshar.",
                    "tags": [
                              "Libro"
                    ]
          },
          "zelda": {
                    "name": "The Legend of Zelda",
                    "emoji": "🗡️",
                    "summary": "La saga de Nintendo sobre el reino de Hyrule.",
                    "tags": [
                              "Videojuego"
                    ]
          },
          "hp": {
                    "name": "Harry Potter",
                    "emoji": "⚡",
                    "summary": "El mundo mágico creado por J.K. Rowling.",
                    "tags": [
                              "Libro",
                              "Película"
                    ]
          }
};

        const items = {
          "the-shire": {
                    "originId": "lotr",
                    "title": "The Shire",
                    "emoji": "🌿",
                    "detail": "Hogar de los Hobbits, un lugar de paz y colinas verdes.",
                    "quote": "En un agujero en el suelo, vivía un hobbit.",
                    "location": "Nombre de Mesa",
                    "comments": [
                              {
                                        "by": "Novio",
                                        "text": "Nuestro lugar soñado."
                              }
                    ]
          },
          "felix-felicis": {
                    "originId": "hp",
                    "title": "Felix Felicis",
                    "emoji": "✨",
                    "detail": "Poción de suerte líquida que garantiza el éxito en todo.",
                    "quote": "Te sentirás capaz de cualquier cosa.",
                    "location": "Regalito de invitados",
                    "comments": [
                              {
                                        "by": "Novia",
                                        "text": "Un detalle mágico para todos."
                              }
                    ]
          },
          "roshar": {
                    "originId": "stormlight",
                    "title": "Roshar",
                    "emoji": "🦀",
                    "detail": "Mundo azotado por tormentas y caballeros radiantes.",
                    "quote": "Viaje antes que destino.",
                    "location": "Nombre de Mesa",
                    "comments": [
                              {
                                        "by": "Novio",
                                        "text": "La mejor construcción de mundo."
                              }
                    ]
          }
};

        function navigateTo(id) {
            // Intentar actualizar el hash para que el QR funcione, pero capturar error si el entorno lo bloquea
            try {
                window.location.hash = id;
            } catch (e) {
                console.warn("Navegación por URL bloqueada, usando navegación interna.");
            }
            router(id); // Ejecutar la lógica de cambio de vista manualmente
        }

        function getTagClass(tag) {
            const t = tag.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            return `tag-${t}`;
        }

        function renderOrigins() {
            const grid = document.getElementById('origins-grid');
            grid.innerHTML = '';
            Object.keys(origins).forEach(id => {
                const origin = origins[id];
                const card = document.createElement('div');
                card.className = `glass p-6 rounded-3xl cursor-pointer card-hover border border-slate-800 flex items-center gap-4`;
                card.onclick = () => navigateTo(`origin-${id}`);
                card.innerHTML = `
                    <div class="text-4xl">${origin.emoji}</div>
                    <div class="flex-1">
                        <h3 class="fandom-title text-lg font-bold text-yellow-500">${origin.name}</h3>
                        <div class="flex gap-1 mt-1">
                            ${origin.tags.map(t => `<span class="text-[7px] px-1.5 py-0.5 rounded uppercase font-bold ${getTagClass(t)}">${t}</span>`).join('')}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderItemsInOrigin(originId) {
            const origin = origins[originId];
            const header = document.getElementById('origin-info-header');
            const grid = document.getElementById('items-grid');
            header.innerHTML = `<div class="text-center glass p-6 rounded-3xl border-b-2 border-yellow-500/50"><div class="text-5xl mb-3">${origin.emoji}</div><h2 class="fandom-title text-2xl font-bold text-yellow-500 mb-2">${origin.name}</h2></div>`;
            grid.innerHTML = '';
            Object.keys(items).filter(k => items[k].originId === originId).forEach(itemId => {
                const item = items[itemId];
                const div = document.createElement('div');
                div.className = `glass p-4 rounded-2xl flex items-center justify-between cursor-pointer card-hover border border-slate-800`;
                div.onclick = () => navigateTo(itemId);
                div.innerHTML = `<div><h4 class="font-bold text-white uppercase text-sm">${item.title}</h4><p class="text-yellow-500/70 text-[9px] font-bold uppercase">📍 ${item.location}</p></div><span class="text-xl">${item.emoji}</span>`;
                grid.appendChild(div);
            });
        }

        function renderDetail(itemId) {
            const item = items[itemId];
            const origin = origins[item.originId];
            const container = document.getElementById('detail-content');
            document.getElementById('back-to-list').onclick = () => navigateTo(`origin-${item.originId}`);
            document.getElementById('back-text').innerText = `Volver a ${origin.name}`;
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="text-center"><div class="text-6xl mb-4">${item.emoji}</div><h2 class="fandom-title text-3xl font-bold text-yellow-500">${item.title}</h2><div class="location-badge inline-block px-4 py-1 rounded-full text-[10px] uppercase mt-4">En: ${item.location}</div></div>
                    <div class="glass p-5 rounded-3xl border-l-4 border-slate-700"><h4 class="text-slate-500 text-[10px] font-bold uppercase mb-1">Origen</h4><div class="font-bold text-white text-base">${origin.name}</div><p class="text-slate-400 text-xs italic">${origin.summary}</p></div>
                    <div class="glass p-5 rounded-3xl border border-slate-800"><h4 class="text-yellow-600 text-[10px] font-bold uppercase mb-2">Detalle</h4><p class="text-slate-200 text-sm">${item.detail}</p></div>
                    <blockquote class="my-6"><p class="text-slate-400 text-sm italic">"${item.quote}"</p></blockquote>
                    <div class="glass p-5 rounded-3xl border-t border-slate-800 space-y-4">
                        <h4 class="text-slate-500 text-[10px] font-bold uppercase">Opinión</h4>
                        ${item.comments.map(c => `<div class="border-l-2 border-slate-800 pl-3"><span class="text-[9px] px-2 py-0.5 rounded font-bold uppercase bg-yellow-500/20 text-yellow-400">${c.by}</span><p class="text-slate-300 text-sm italic mt-1">"${c.text}"</p></div>`).join('')}
                    </div>
                </div>`;
        }

        function router(manualId) {
            const hash = manualId !== undefined ? manualId : location.hash.replace('#', '');
            const vOrigins = document.getElementById('view-origins');
            const vItems = document.getElementById('view-items');
            const vDetail = document.getElementById('view-detail');

            [vOrigins, vItems, vDetail].forEach(v => {
                v.style.display = 'none';
                v.classList.add('hidden-section');
            });

            if (!hash) {
                renderOrigins();
                show(vOrigins);
            } else if (hash.startsWith('origin-')) {
                const oid = hash.replace('origin-', '');
                if (origins[oid]) {
                    renderItemsInOrigin(oid);
                    show(vItems);
                } else { navigateTo(''); }
            } else if (items[hash]) {
                renderDetail(hash);
                show(vDetail);
            } else {
                navigateTo('');
            }
        }

        function show(el) {
            el.style.display = 'block';
            setTimeout(() => {
                el.classList.remove('hidden-section');
                el.style.opacity = '1';
                el.style.transform = 'translateY(0)';
            }, 50);
            window.scrollTo(0, 0);
        }

        // Detectar cambios en la URL (para cuando los invitados escanean el QR)
        window.addEventListener('hashchange', () => router());
        // Al cargar, ejecutar el router para leer la URL inicial
        window.onload = () => router();
    </script>
</body>
</html>
