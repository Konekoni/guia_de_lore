<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivo del Gremio - Referencias Frikis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .fandom-title { font-family: 'Cinzel', serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .transition-page { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .hidden-section { display: none; opacity: 0; transform: translateY(10px); }
        
        .glow-yellow { box-shadow: 0 0 20px rgba(234, 179, 8, 0.15); border-left: 4px solid #eab308; }
        .glow-blue { box-shadow: 0 0 20px rgba(59, 130, 246, 0.15); border-left: 4px solid #3b82f6; }
        .glow-green { box-shadow: 0 0 20px rgba(34, 197, 94, 0.15); border-left: 4px solid #22c55e; }
        .glow-purple { box-shadow: 0 0 20px rgba(168, 85, 247, 0.15); border-left: 4px solid #a855f7; }
        .glow-red { box-shadow: 0 0 20px rgba(239, 68, 68, 0.15); border-left: 4px solid #ef4444; }
        
        .card-hover:hover { transform: scale(1.02); background: rgba(51, 65, 85, 0.8); }
    </style>
</head>
<body class="min-h-screen bg-slate-950 selection:bg-yellow-500/30">

    <div id="app" class="max-w-md mx-auto p-4 md:p-6">
        
        <header class="text-center py-10">
            <h1 class="fandom-title text-3xl font-bold tracking-[0.2em] text-yellow-500 drop-shadow-md">ARCHIVO DEL GREMIO</h1>
            <p class="text-slate-500 text-[10px] uppercase tracking-[0.4em] mt-3">Crónicas & Alquimia del Evento</p>
            <div class="h-1 w-12 bg-yellow-600 mx-auto mt-4 rounded-full opacity-50"></div>
        </header>

        <!-- VISTA MENÚ -->
        <section id="view-menu" class="transition-page space-y-6">
            <div class="flex items-center justify-between border-b border-slate-800 pb-4">
                <h2 class="text-lg font-semibold text-slate-200">Catálogo de Referencias</h2>
                <span class="bg-slate-800 text-slate-400 text-[10px] px-2 py-1 rounded-md uppercase tracking-wider font-bold" id="item-count">0 ITEMS</span>
            </div>
            
            <div id="menu-grid" class="grid grid-cols-1 gap-4 pb-20">
                <!-- Inyectado por JS -->
            </div>
        </section>

        <!-- VISTA DETALLE -->
        <section id="view-detail" class="hidden-section transition-page">
            <button onclick="navigateTo('')" class="mb-8 flex items-center text-slate-400 hover:text-yellow-500 transition-all group bg-slate-900/50 pr-4 rounded-full border border-slate-800">
                <div class="bg-slate-800 p-3 rounded-full mr-3 group-hover:bg-yellow-500 group-hover:text-slate-950 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
                    </svg>
                </div>
                <span class="text-xs uppercase font-bold tracking-widest">Cerrar Archivo</span>
            </button>

            <div id="detail-content">
                <!-- Inyectado por JS -->
            </div>
        </section>

    </div>

    <script>
        const items = {
            // MESAS / LUGARES
            "the-shire": {
                title: "The Shire",
                category: "Lugar (Mesa)",
                fandom: "El Señor de los Anillos",
                color: "green",
                icon: "🌿",
                lore: "Tierra fértil de colinas verdes y paz absoluta. El hogar de los Hobbits es famoso por su hierba para pipa y sus banquetes interminables.",
                points: ["Agujeros Hobbit", "La Taberna del Dragón Verde", "El Viejo Bosque"],
                images: ["https://placehold.co/600x400/166534/f1f5f9?text=La+Comarca"]
            },
            "roshar": {
                title: "Roshar",
                category: "Lugar (Mesa)",
                fandom: "El Archivo de las Tormentas",
                color: "blue",
                icon: "🌪️",
                lore: "Un mundo de roca azotado por las Altas Tormentas, donde la flora se retrae al ser tocada y la luz de tormenta alimenta los poderes de los Caballeros Radiantes.",
                points: ["Llanuras Quebradas", "Urithiru", "Spren de vida"],
                images: ["https://placehold.co/600x400/1e40af/f1f5f9?text=Roshar"]
            },
            "hyrule": {
                title: "Hyrule",
                category: "Lugar (Mesa)",
                fandom: "The Legend of Zelda",
                color: "green",
                icon: "🗡️",
                lore: "Reino legendario bendecido por la Trifuerza. Ha sobrevivido a eras de oscuridad gracias al ciclo eterno del héroe y la princesa.",
                points: ["Castillo de Hyrule", "Bosque Perdido", "Montaña de la Muerte"],
                images: ["https://placehold.co/600x400/15803d/f1f5f9?text=Reino+de+Hyrule"]
            },
            "hogwarts": {
                title: "Hogwarts",
                category: "Lugar (Mesa)",
                fandom: "Harry Potter",
                color: "purple",
                icon: "🏰",
                lore: "Castillo encantado que sirve como colegio de magia y hechicería. Sus escaleras se mueven y sus muros guardan secretos centenarios.",
                points: ["El Gran Comedor", "Sala de los Menesteres", "Bosque Prohibido"],
                images: ["https://placehold.co/600x400/581c87/f1f5f9?text=Hogwarts"]
            },
            
            // CRAFTS
            "felix-felicis": {
                title: "Felix Felicis",
                category: "Craft / Poción",
                fandom: "Harry Potter",
                color: "yellow",
                icon: "✨",
                lore: "Llamada 'Suerte Líquida'. Otorga al bebedor un éxito temporal en todo lo que intente. Es extremadamente difícil de preparar.",
                points: ["Ingredientes: Miel de Bosque", "Polvo de Nácar Comestible", "Esencia de Fortuna"],
                images: ["https://placehold.co/600x400/a16207/f1f5f9?text=Pocion+Final"]
            },
            "minuta-hogwarts": {
                title: "Carta de Hogwarts",
                category: "Craft / Objeto",
                fandom: "Harry Potter",
                color: "yellow",
                icon: "✉️",
                lore: "La invitación que todo joven mago espera recibir al cumplir los 11 años. Escrita en tinta verde sobre pergamino de vitela.",
                points: ["Escudo de Hogwarts", "Lacre Rojo", "Lista de Materiales"],
                images: ["https://placehold.co/600x400/78350f/f1f5f9?text=El+Sobre"]
            },
            
            // CULTURA
            "tanabata": {
                title: "Festival de Tanabata",
                category: "Cultura",
                fandom: "Tradición Japonesa / Anime",
                color: "blue",
                icon: "🏮",
                lore: "El festival de las estrellas. Celebra el encuentro anual de Orihime y Hikoboshi, separados por la Vía Láctea.",
                points: ["Deseos en Tanzaku", "Ramas de Bambú", "7 de Julio"],
                images: ["https://placehold.co/600x400/1e3a8a/f1f5f9?text=Tanabata"]
            },
            
            // SIMBOLOS
            "trifuerza": {
                title: "La Trifuerza",
                category: "Símbolo",
                fandom: "The Legend of Zelda",
                color: "yellow",
                icon: "📐",
                lore: "La reliquia definitiva dejada por las diosas. Representa el equilibrio perfecto entre Poder, Sabiduría y Valor.",
                points: ["Din (Poder)", "Nayru (Sabiduría)", "Farore (Valor)"],
                images: ["https://placehold.co/600x400/854d0e/f1f5f9?text=La+Reliquia"]
            },
            "pokeball": {
                title: "Poké Ball",
                category: "Símbolo / Tecnología",
                fandom: "Pokémon",
                color: "red",
                icon: "🔴",
                lore: "Dispositivo esférico diseñado para capturar y transportar criaturas salvajes. Un icono de la cultura de entrenadores.",
                points: ["Cápsula de Captura", "Botón de Apertura", "Digitalización de Datos"],
                images: ["https://placehold.co/600x400/991b1b/f1f5f9?text=Captura"]
            },
            "radiantes": {
                title: "Signo Radiante",
                category: "Símbolo / Orden",
                fandom: "El Archivo de las Tormentas",
                color: "blue",
                icon: "💠",
                lore: "El emblema que representa a los Caballeros Radiantes. Simboliza los ideales: 'Vida antes que muerte, fuerza antes que debilidad, viaje antes que destino'.",
                points: ["Vínculo Nahel", "Armas Esquirladas", "Ideales Inmortales"],
                images: ["https://placehold.co/600x400/1e3a8a/f1f5f9?text=Juramento"]
            }
        };

        function navigateTo(id) {
            try {
                if (id) {
                    window.history.pushState(null, null, '#' + id);
                } else {
                    window.history.pushState(null, null, window.location.pathname);
                }
            } catch (e) {
                console.warn("Navegación local activa.");
            }
            router(id);
        }

        function renderMenu() {
            const grid = document.getElementById('menu-grid');
            const countLabel = document.getElementById('item-count');
            grid.innerHTML = '';
            
            const keys = Object.keys(items);
            countLabel.innerText = `${keys.length} Items`;

            keys.forEach(id => {
                const item = items[id];
                const card = document.createElement('div');
                card.className = `glass p-4 rounded-2xl flex items-center justify-between cursor-pointer card-hover glow-${item.color} transition-all`;
                card.onclick = () => navigateTo(id);
                card.innerHTML = `
                    <div class="flex items-center space-x-4">
                        <span class="text-3xl filter drop-shadow-md">${item.icon}</span>
                        <div>
                            <p class="text-[9px] text-slate-500 uppercase tracking-widest font-bold mb-0.5">${item.category}</p>
                            <h3 class="font-bold text-white text-md leading-tight">${item.title}</h3>
                            <p class="text-[10px] text-yellow-600/80 uppercase tracking-wider mt-0.5">${item.fandom}</p>
                        </div>
                    </div>
                    <div class="bg-slate-800/50 p-2 rounded-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-500" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
                        </svg>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderDetail(id) {
            const item = items[id];
            const container = document.getElementById('detail-content');
            
            if (!item) {
                navigateTo('');
                return;
            }

            container.innerHTML = `
                <div class="space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500">
                    <div class="text-center py-6">
                        <span class="text-8xl mb-6 block drop-shadow-2xl animate-bounce-slow">${item.icon}</span>
                        <p class="text-${item.color}-500 font-bold uppercase text-[10px] tracking-[0.3em] mb-2">${item.category}</p>
                        <h2 class="fandom-title text-4xl font-bold text-white tracking-wide">${item.title}</h2>
                        <p class="text-slate-500 font-medium uppercase text-[11px] tracking-widest mt-2">${item.fandom}</p>
                    </div>

                    <div class="glass p-6 rounded-3xl relative overflow-hidden">
                        <div class="absolute -top-4 -right-4 p-8 opacity-5 text-6xl italic font-serif">Lore</div>
                        <h3 class="text-white font-bold mb-4 flex items-center text-xs uppercase tracking-[0.2em]">
                            <span class="bg-${item.color}-500/20 p-2 rounded-xl mr-4 text-${item.color}-400">📖</span> 
                            Trasfondo Histórico
                        </h3>
                        <p class="text-slate-300 text-sm italic leading-relaxed z-10 relative border-l-2 border-slate-700 pl-4">${item.lore}</p>
                    </div>

                    <div class="glass p-6 rounded-3xl border-b-4 border-${item.color}-600">
                        <h3 class="text-white font-bold mb-5 flex items-center text-xs uppercase tracking-[0.2em]">
                            <span class="bg-${item.color}-500/20 p-2 rounded-xl mr-4 text-${item.color}-400">🔍</span> 
                            Detalles Clave
                        </h3>
                        <div class="grid grid-cols-1 gap-3">
                            ${item.points.map(point => `
                                <div class="flex items-center space-x-3 bg-slate-900/40 p-3 rounded-2xl border border-slate-800/50">
                                    <div class="w-1.5 h-1.5 rounded-full bg-${item.color}-500"></div>
                                    <span class="text-slate-300 text-[13px] font-medium">${point}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="rounded-3xl overflow-hidden glass p-2 shadow-2xl">
                        <img src="${item.images[0]}" class="w-full h-auto rounded-2xl object-cover grayscale-[0.2] hover:grayscale-0 transition-all duration-700" 
                             onerror="this.src='https://placehold.co/600x400/1e293b/94a3b8?text=${item.title}'">
                    </div>
                    
                    <footer class="text-center py-10 opacity-30">
                        <p class="text-[9px] uppercase tracking-widest">Fin del Registro • Gremio de Alquimia</p>
                    </footer>
                </div>
            `;
        }

        function router(providedId) {
            const hash = providedId !== undefined ? providedId : location.hash.replace('#', '');
            const menuView = document.getElementById('view-menu');
            const detailView = document.getElementById('view-detail');

            if (hash && items[hash]) {
                renderDetail(hash);
                menuView.classList.add('hidden-section');
                setTimeout(() => {
                    menuView.style.display = 'none';
                    detailView.style.display = 'block';
                    window.scrollTo(0, 0);
                    setTimeout(() => detailView.classList.remove('hidden-section'), 50);
                }, 300);
            } else {
                detailView.classList.add('hidden-section');
                setTimeout(() => {
                    detailView.style.display = 'none';
                    menuView.style.display = 'block';
                    renderMenu();
                    setTimeout(() => menuView.classList.remove('hidden-section'), 50);
                }, 300);
            }
        }

        window.addEventListener('popstate', () => router());
        window.onload = () => router();
    </script>

    <style>
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-bounce-slow { animation: bounce-slow 4s ease-in-out infinite; }
    </style>
</body>
</html>
